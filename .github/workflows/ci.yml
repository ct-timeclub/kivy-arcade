name: Pruebas

# Corre en cada push y en cada pull request. Es rápido (1-2 minutos) y es lo que
# protege a main: si el juego de un alumno rompe algo, aquí se ve antes de mezclarlo.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # Kivy necesita una pantalla y OpenGL aunque sea virtual: xvfb + Mesa (render por software).
      - name: Instalar librerías de sistema (pantalla virtual)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libglx-mesa0 libegl1

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Revisar estilo (ruff)
        run: python -m ruff check .

      - name: Ejecutar pruebas
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x800x24" python -m pytest
